name: Add click capture to Innovid creatives (one-off)

# Publisher-side population of click-audience segment 9443004817: append the
# capture <script> block to the Innovid ThirdPartyCreative snippets on the
# Apple at Work PG interstitial (LI 7384069597). See docs/click_audience.md.
#
# Staged rollout is driven by the TARGET env below (pre-merge pushes) or the
# workflow_dispatch input (post-merge): dryrun -> canary (one creative) ->
# all. rollback strips the block everywhere. The script is marker-idempotent,
# so re-runs no-op.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rollout stage"
        required: true
        default: "dryrun"
        type: choice
        options: [dryrun, canary, all, rollback]
  push:
    branches: [claude/click-audience-li7384069597]
    paths:
      - 'scripts/add_click_capture_to_creatives.py'
      - '.github/workflows/add_click_capture.yml'

env:
  # Pre-merge stage knob (workflow_dispatch input overrides it):
  #   dryrun | canary | all | rollback
  # rollback since 2026-08-05: the capture moved to the creative wrapper on
  # the interstitial unit (setup_click_capture_wrapper.py) — snippets are
  # restored to the byte-identical Innovid originals.
  TARGET: rollback
  CANARY_CREATIVE: "138568851141"

permissions:
  contents: read
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install google-ads-admanager google-auth pandas googleads

      - name: Run (stage from TARGET / dispatch input)
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          set -o pipefail
          STAGE="${DISPATCH_TARGET:-$TARGET}"
          echo "stage: $STAGE"
          case "$STAGE" in
            dryrun)
              python scripts/add_click_capture_to_creatives.py ;;
            canary)
              python scripts/add_click_capture_to_creatives.py \
                --creative-ids "$CANARY_CREATIVE" --apply ;;
            all)
              python scripts/add_click_capture_to_creatives.py --apply ;;
            rollback)
              python scripts/add_click_capture_to_creatives.py --rollback --apply ;;
            *)
              echo "unknown stage: $STAGE"; exit 1 ;;
          esac 2>&1 | tee /tmp/output.txt

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Click capture rollout'
            echo ''
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            cat /tmp/output.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
