name: Setup Insights native demo

# Applies the ?nwdemocr=-gated demo of the fixed-size Insights banners using the
# repo's GAM secrets -- the way to run a one-off GAM job when no session has
# local credentials (see the note in CLAUDE.md on Actions-driven GAM pulls).
#
# Everything the script creates is gated behind the nwdemocr key-value, so
# nothing serves to a reader without the param. `undo` reverses it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (default, writes nothing) | apply | undo'
        required: false
        default: 'dry-run'
        type: choice
        options: [dry-run, apply, undo]
      demo_value:
        description: 'nwdemocr value to gate the demo behind'
        required: false
        default: 'insightsbanner'

permissions:
  contents: read
  pull-requests: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install googleads

      - name: Run demo setup
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          MODE: ${{ inputs.mode }}
          DEMO_VALUE: ${{ inputs.demo_value }}
        run: |
          set -o pipefail
          case "$MODE" in
            apply) ARGS="--apply" ;;
            undo)  ARGS="--apply --undo" ;;
            *)     ARGS="" ;;
          esac
          python scripts/setup_insights_native_demo.py $ARGS \
            --demo-value "$DEMO_VALUE" 2>&1 | tee /tmp/output.txt

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Insights native demo — `'"$MODE"'`'
            echo ''
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            tail -c 58000 /tmp/output.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
