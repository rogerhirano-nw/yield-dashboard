name: Click-audience recon (one-off)

# Read-only recon for building a "users who clicked LI 7384069597" first-party
# audience segment (Roger, 2026-08-04): dump the LI + its creatives (creative
# type decides the click-capture mechanism) and probe Audience Solutions state
# (existing first-party segments, DFPAudiencePixel unit). Copied from the
# pull_index_ob_requests.yml one-off template — GAM creds live only in repo
# secrets, so cloud/local sessions dispatch this instead of running locally.
on:
  workflow_dispatch:
    inputs:
      line_item_id:
        description: "Line item id to inspect"
        required: false
        default: "7384069597"
        type: string
  push:
    branches: [claude/click-audience-li7384069597]
    paths:
      - 'scripts/inspect_click_audience_li.py'
      - '.github/workflows/inspect_click_audience.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    # GAM HISTORICAL report operations can poll >10 min from this SA — the
    # 8/5 pixel-hit checks were cancelled mid-report at the old 10-min cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install google-ads-admanager google-auth pandas googleads

      - name: Run recon
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          LI_ID: ${{ inputs.line_item_id }}
        run: |
          set -o pipefail
          python scripts/inspect_click_audience_li.py "${LI_ID:-7384069597}" 2>&1 | tee /tmp/output.txt

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Click-audience recon — LI creatives + Audience Solutions state'
            echo ''
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            cat /tmp/output.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
