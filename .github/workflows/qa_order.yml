name: QA GAM order

# Read-only dump of every line item on an order (targeting, placeholders,
# creatives, trackers). A push runs it for PUSH_ORDER.

on:
  workflow_dispatch:
    inputs:
      order:
        description: 'GAM order id'
        required: true
  push:
    branches: [claude/gallant-lovelace-rdmcbf]
    paths:
      - 'scripts/qa_order.py'
      - 'scripts/inspect_line_item.py'
      - '.github/workflows/qa_order.yml'

env:
  PUSH_ORDER: "4236300211"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install googleads
      - name: QA
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          IN_ORDER: ${{ inputs.order }}
        run: python scripts/qa_order.py "${IN_ORDER:-$PUSH_ORDER}"
