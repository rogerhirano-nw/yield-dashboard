name: GAM non-US avails by country

on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many closed months to average over"
        required: false
        default: "3"
      start:
        description: "Start month YYYY-MM (overrides months)"
        required: false
      end:
        description: "End month YYYY-MM"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  avails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install google-ads-admanager google-auth pandas openpyxl

      - name: Run pull
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          MONTHS: ${{ inputs.months }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -o pipefail
          ARGS="--months ${MONTHS:-3}"
          if [ -n "$START" ]; then ARGS="--start $START"; fi
          if [ -n "$END" ]; then ARGS="$ARGS --end $END"; fi
          python scripts/gam_intl_avails.py $ARGS \
            --csv-dir out \
            --xlsx "out/Newsweek_NonUS_Avails.xlsx" 2>&1 | tee /tmp/output.txt

      - name: Upload workbook + CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gam-intl-avails
          path: out/

      - name: Post summary as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### GAM non-US avails by country'
            echo ''
            echo "Workbook + CSVs are on the run's artifacts."
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            cat /tmp/output.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
