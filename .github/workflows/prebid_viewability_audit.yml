name: Prebid viewability audit (GAM)

# Pulls Active View by hb_bidder x ad unit x device x rendered size and splits
# each bidder's gap vs its peers into placement MIX and bidder-specific
# RENDER. See docs/prebid_viewability.md.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (ending yesterday)'
        required: false
        default: '21'
      bidders:
        description: 'Bidders to detail cell-by-cell'
        required: false
        default: 'smilewanted,ogury,oms,onetag'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install google-ads-admanager google-auth pandas

      - name: Run audit
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          DAYS: ${{ inputs.days }}
          BIDDERS: ${{ inputs.bidders }}
          OUT_DIR: /tmp/prebid-viewability-audit
        run: |
          set -o pipefail
          python scripts/prebid_viewability_audit.py 2>&1 | tee /tmp/output.txt

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebid-viewability-audit
          path: /tmp/prebid-viewability-audit/
          if-no-files-found: ignore

      # The audit normally runs from main, where there is no PR to comment on,
      # so the job summary is the real output surface.
      - name: Write output to job summary
        if: always()
        run: |
          {
            echo '### Prebid viewability audit (GAM Active View, mix vs render)'
            echo ''
            echo '```'
            tail -c 60000 /tmp/output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Prebid viewability audit (GAM Active View, mix vs render)'
            echo ''
            echo "Workflow run (CSVs in artifacts): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            tail -c 58000 /tmp/output.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
