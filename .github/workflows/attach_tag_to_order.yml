name: Attach agency tag to order

# Creates one declared ThirdPartyCreative from a tag file and associates it
# with an order's line items. A push is a dry run unless APPLY_ON_PUSH is
# flipped in a reviewed commit.

on:
  workflow_dispatch:
  push:
    branches: [claude/happy-einstein-sqg1tw]
    paths:
      - 'scripts/attach_tag_to_order.py'
      - '.github/workflows/attach_tag_to_order.yml'

env:
  APPLY_ON_PUSH: "true"
  ORDER: "4187974224"
  TAG: scripts/orders/tags/matchbox_ft11167131_js_https.html
  NAME: 07423706_wwa_us_dis_atv_atvacq_pdis_amzdspnwk_staf_intl_cpm_aos_mobtab_adevt_gnt_broa_prlp_lfnnl_usen_heroart_static_11ar_ban_mboxtm_nwmvirls_prlm_wt_na_na_matchboxnewsweekpre
  SIZE: "2x1"
  ATP: "209"
  LINE_ITEMS: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install googleads
      - name: Attach
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS=""
          if [ "$EVENT" = "push" ] && [ "$APPLY_ON_PUSH" = "true" ]; then ARGS="--apply"; fi
          if [ -n "$LINE_ITEMS" ]; then ARGS="$ARGS --line-items $LINE_ITEMS"; fi
          python scripts/attach_tag_to_order.py --order "$ORDER" --tag "$TAG" --name "$NAME" \
            --size "$SIZE" --atp "$ATP" $ARGS
