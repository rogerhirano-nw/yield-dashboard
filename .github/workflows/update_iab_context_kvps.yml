name: Update GAM IAB content-taxonomy KVPs (v3.1 + v2.2 + v1.0)

# A push that touches these files runs the sync. It is a DRY RUN unless
# APPLY_ON_PUSH is "true" — flip it in its own commit, read the run, flip back.
on:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/update_iab_context_kvps.py"
      - "data/iab_content_taxonomy_3_1.tsv"
      - "data/iab_content_taxonomy_2_2.tsv"
      - "data/iab_content_taxonomy_1_0.tsv"
      - ".github/workflows/update_iab_context_kvps.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no writes)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

env:
  APPLY_ON_PUSH: "true"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - taxonomy: "3.1"
            args: "--tsv data/iab_content_taxonomy_3_1.tsv --key-name iab_context_v3"
          - taxonomy: "2.2"
            args: "--tsv data/iab_content_taxonomy_2_2.tsv --key-id 19649704"
          - taxonomy: "1.0"
            args: "--tsv data/iab_content_taxonomy_1_0.tsv --key-id 19649371"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install googleads
      - name: Sync values (IAB ${{ matrix.taxonomy }})
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "push" ] && [ "$APPLY_ON_PUSH" != "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" != "false" ]; then ARGS="--dry-run"; fi
          echo "args: $ARGS"
          python scripts/update_iab_context_kvps.py ${{ matrix.args }} $ARGS
