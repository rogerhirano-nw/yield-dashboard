name: Pull Magnite OB Video Ad Requests (one-off)

on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-wright-k0r0lb]
    paths:
      - 'scripts/pull_magnite_ob_video_requests.py'
      - '.github/workflows/pull_magnite_ob_video_requests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install google-ads-admanager google-auth pandas

      - name: Run pull
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          CSV_OUT: /tmp/magnite_ob_gam_rows.csv
        run: |
          set -o pipefail
          python scripts/pull_magnite_ob_video_requests.py 2>&1 | tee /tmp/output.txt

      - name: Upload the raw GAM rows as a shareable CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnite-ob-gam-rows
          path: /tmp/magnite_ob_gam_rows.csv
          if-no-files-found: warn

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Magnite — Open Bidding video ad requests (GAM callouts)'
            echo ''
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            cat /tmp/output.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
