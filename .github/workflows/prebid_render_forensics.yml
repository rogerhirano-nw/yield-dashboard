name: Prebid render forensics (on-page)

# Loads real Newsweek ARTICLE pages in headless Chromium, instruments GPT +
# Prebid, and reports how each winning bidder's creative renders — the DOM
# evidence that separates a Mobkoi-class breakout from a placement-mix story.
# See docs/prebid_viewability.md.

on:
  workflow_dispatch:
    inputs:
      loads:
        description: 'Article page loads (each load runs every profile)'
        required: false
        default: '12'
      profiles:
        description: 'Emulation profiles: mobile,desktop'
        required: false
        default: 'mobile,desktop'
      target_bidders:
        description: 'Bidders to dump in full detail'
        required: false
        default: 'smilewanted,oms,onetag,ogury'
      article_urls:
        description: 'Comma-separated article URLs (blank = scrape fresh ones off the homepage)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run forensics
        env:
          LOADS: ${{ inputs.loads }}
          PROFILES: ${{ inputs.profiles }}
          TARGET_BIDDERS: ${{ inputs.target_bidders }}
          ARTICLE_URLS: ${{ inputs.article_urls }}
          SHOTS_DIR: /tmp/prebid-forensics
        run: |
          set -o pipefail
          python scripts/prebid_render_forensics.py 2>&1 | tee /tmp/output.txt

      - name: Upload screenshots + renders.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebid-render-forensics
          path: /tmp/prebid-forensics/
          if-no-files-found: ignore

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Prebid on-page render forensics'
            echo ''
            echo "Workflow run (screenshots + renders.json in artifacts): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            tail -c 58000 /tmp/output.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
