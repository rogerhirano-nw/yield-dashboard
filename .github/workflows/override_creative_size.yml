name: Override creative size (LICA)

# Adds size(s) to (or, with mode=replace, sets) LineItemCreativeAssociation.sizes
# for one creative on every line item it
# is attached to. A push is a dry run unless APPLY_ON_PUSH is flipped to "true"
# in its own commit; a manual dispatch writes only with apply=true.

on:
  workflow_dispatch:
    inputs:
      creative_id:
        description: 'GAM creative id(s), comma or space separated'
        required: true
      sizes:
        description: 'Override size(s), comma-separated'
        required: true
        default: '970x250'
      mode:
        description: 'add (keep existing override, add sizes) or replace'
        type: choice
        options: [add, replace]
        default: add
      apply:
        description: 'Write to GAM (false = dry run)'
        type: boolean
        default: false
  push:
    branches: [claude/sleepy-babbage-cni9za]
    paths:
      - 'scripts/override_creative_size.py'
      - '.github/workflows/override_creative_size.yml'

env:
  APPLY_ON_PUSH: "false"
  PUSH_CREATIVE: "138502478327 138502478330 138502478336 138502478600 138502478603 138502478609 138502478612 138502478615 138502478621 138502478624 138502478630"
  PUSH_SIZES: "970x250"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install googleads
      - name: Override size
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          IN_CR: ${{ inputs.creative_id }}
          IN_SIZES: ${{ inputs.sizes }}
          IN_MODE: ${{ inputs.mode }}
          IN_APPLY: ${{ inputs.apply }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          ARGS="--mode ${IN_MODE:-add}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$EVENT" = "push" ] && [ "$APPLY_ON_PUSH" = "true" ]; then ARGS="$ARGS --apply"; fi
          rm -f /tmp/failed
          for CR in $(echo "${IN_CR:-$PUSH_CREATIVE}" | tr ',' ' '); do
            echo "================ creative $CR ================"
            python -u scripts/override_creative_size.py "$CR" "${IN_SIZES:-$PUSH_SIZES}" $ARGS 2>&1 | grep -v -E '^(    placeholders|    LICA ACTIVE|  LI |    -> already set|$)' || echo "$CR" >> /tmp/failed
          done 2>&1 | tee /tmp/out.txt
          { echo '```'; grep -v -E '^(  LI |    -> set)' /tmp/out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/failed ]; then echo "FAILED creatives: $(cat /tmp/failed)"; exit 1; fi
