name: Prebid bidder viewability — by device / OS / browser (GAM)

# One bidder on one ad unit, cut by device category, OS version, browser and
# device model, each segment graded against the other bidders in it. Built for
# Ogury's sticky deficit. See scripts/prebid_bidder_segment_viewability.py.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (ending yesterday)'
        required: false
        default: '11'
      bidder:
        description: 'hb_bidder value to detail'
        required: false
        default: 'ogury'
      ad_unit:
        description: 'Ad unit name (leaf) to cut'
        required: false
        default: 'sticky'
  # A new workflow can't be dispatched until it's on main, so the first run
  # rides a push that touches it.
  push:
    paths:
      - scripts/prebid_bidder_segment_viewability.py
      - .github/workflows/prebid_bidder_segment_viewability.yml

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install google-ads-admanager google-auth pandas

      - name: Run pull
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          DAYS: ${{ inputs.days }}
          BIDDER: ${{ inputs.bidder }}
          AD_UNIT: ${{ inputs.ad_unit }}
          OUT_DIR: /tmp/prebid-bidder-segments
        run: |
          set -o pipefail
          python scripts/prebid_bidder_segment_viewability.py 2>&1 | tee /tmp/output.txt

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebid-bidder-segments
          path: /tmp/prebid-bidder-segments/
          if-no-files-found: ignore

      - name: Write output to job summary
        if: always()
        run: |
          {
            echo '### Prebid bidder viewability — daily, before vs after'
            echo ''
            echo '```'
            tail -c 60000 /tmp/output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
