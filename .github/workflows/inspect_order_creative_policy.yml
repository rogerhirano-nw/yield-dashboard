name: Inspect order creative policy flags

# Read-only: lists every creative on a GAM order with its policyLabels
# (malware-in-creative vs landing page, etc.) and the URLs it loads.
# A push to the branch below runs it for PUSH_ORDER.

on:
  workflow_dispatch:
    inputs:
      order:
        description: 'GAM order id or name fragment (e.g. SO01084)'
        required: true
  push:
    branches: [claude/beautiful-goldberg-m6tvv8]
    paths:
      - 'scripts/inspect_order_creative_policy.py'
      - '.github/workflows/inspect_order_creative_policy.yml'

env:
  PUSH_ORDER: "SO01084"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install googleads
      - name: Inspect
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          IN_ORDER: ${{ inputs.order }}
        run: python scripts/inspect_order_creative_policy.py "${IN_ORDER:-$PUSH_ORDER}"
