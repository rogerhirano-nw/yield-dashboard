name: Pull related audiences (one-off)

on:
  workflow_dispatch:
    inputs:
      li_id:
        description: 'Line item ID to analyze (default 7300490129)'
        required: false
        default: ''
  push:
    branches: [claude/new-session-jaxa80]
    paths:
      - 'scripts/pull_related_audiences.py'
      - '.github/workflows/pull_related_audiences.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install googleads

      - name: Run pull
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          RELATED_AUD_LI_ID: ${{ inputs.li_id || '7300490129' }}
        run: |
          set -o pipefail
          python scripts/pull_related_audiences.py 2>&1 | tee /tmp/output.txt

      - name: Post summary as PR comment (full TSV stays in the run log)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch ${{ github.ref_name }}"; exit 0
          fi
          {
            echo '### Related audiences — LI 7300490129 (discovery pull)'
            echo ''
            echo "Workflow run (full candidate TSV in the job log): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            # print everything before the TSV marker; when the marker is absent
            # (script died early) print the whole file so the error line survives.
            # `q` under -n quits without printing the marker line itself.
            sed -n '/^BEGIN_RELATED_AUDIENCES_TSV$/q;p' /tmp/output.txt | head -c 55000
            echo ''
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
