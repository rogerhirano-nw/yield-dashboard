name: Apple News CTR by ad size

on:
  push:
    branches: [claude/optimistic-meitner-bkxhx0]
    paths:
      - scripts/apple_news_ctr_by_size.py
      - .github/workflows/apple_news_ctr_by_size.yml
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing days ending yesterday ET"
        required: false
        default: "30"
      min_impr:
        description: "Impressions below which a size is flagged THIN"
        required: false
        default: "10000"

permissions:
  contents: read
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install google-ads-admanager google-auth pandas
      - name: Run pull
        env:
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
          GAM_NETWORK_ID: ${{ secrets.GAM_NETWORK_ID }}
          DAYS: ${{ inputs.days }}
          MIN_IMPR: ${{ inputs.min_impr }}
        run: |
          set -o pipefail
          python scripts/apple_news_ctr_by_size.py --days "${DAYS:-30}" \
            --min-impr "${MIN_IMPR:-10000}" --csv-dir out 2>&1 | tee /tmp/output.txt
      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-news-ctr-by-size
          path: out/
      - name: Post summary as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then echo "No open PR for ${{ github.ref_name }}"; exit 0; fi
          {
            echo '### Apple News CTR by ad size'
            echo ''
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            cat /tmp/output.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
